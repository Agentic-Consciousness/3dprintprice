name: Verify

# The project's type checks, tests and production builds. There was no earlier pipeline for this repository.
# Runs on the personal runner pool only when the organisation variable PERSONAL_GITHUB_CI_ENABLED is 'true'.
# Pull requests from forks never run here: the self-hosted runners only take this repository's own branches.
# Nothing deploys and no secrets are used (Vercel's own GitHub link handles deployment).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    if: ${{ vars.PERSONAL_GITHUB_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Verify
    runs-on: [personal-official]
    container:
      image: node:22-bookworm
      options: --init --cpus 2 --memory 6g
    timeout-minutes: 45
    env:
      COREPACK_HOME: /tmp/Agentic-Consciousness-3dprintprice-corepack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace
        # The job container's user differs from the checkout's owner, so git refuses to read it otherwise.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the checks
        run: bash .github/scripts/verify.sh

  # Frozen-lockfile install + production build. Not a required check;
  # making it required is a separate branch-protection decision for Daniel.
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [personal-official]
    container:
      image: node:24-bookworm
      options: --init --cpus 2 --memory 6g
    timeout-minutes: 60
    env:
      COREPACK_HOME: /tmp/Agentic-Consciousness-3dprintprice-corepack
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # Safe CI fixtures only — no real secrets.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:9/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:9/ci
      NEXTAUTH_SECRET: ci-only-fixture-at-least-thirty-two-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Frozen install and build
        shell: bash
        run: |
          set -euo pipefail
          unset VERCEL_ENV VERCEL VERCEL_TOKEN || true
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
