name: Verify

# Type checks, API tests, and production builds.
# pull_request runs the workflow file from the pull request, including forks.
# A self-hosted runner label in that file would execute outside code on a private
# machine, and an in-workflow guard can be deleted by the same pull request.
# Every trigger of this workflow therefore uses a GitHub-hosted runner.
# Nothing deploys and no secrets are used (Vercel's own GitHub link handles deployment).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        # The self-hosted job ran inside node:22-bookworm. GitHub-hosted runners
        # do not provide the Node 22.23.4 runtime this repo pins in .node-version.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Run the checks
        run: bash .github/scripts/verify.sh
