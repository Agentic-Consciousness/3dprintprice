version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/apps/admin"
      - "/apps/api"
      - "/apps/widget"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/admin"
      - "/apps/api"
      - "/apps/widget"
      - "/packages/shared"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
